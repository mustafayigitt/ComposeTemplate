site_name: ComposeTemplate
site_description: Production-grade Jetpack Compose template generator
site_url: https://mustafayigitt.github.io/ComposeTemplate/
repo_url: https://github.com/mustafayigitt/ComposeTemplate
repo_name: mustafayigitt/ComposeTemplate

docs_dir: wiki

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Overview: README.md
  - 00 - Project Context: 00-project-context.md
  - 01 - Module Topology and Build System: 01-module-topology.md
  - 02 - Navigation and UI State: 02-navigation-and-ui-state.md
  - 03 - Network and Auth Token Flow: 03-network-and-auth.md
  - 04 - Secrets, Security and Hardening: 04-secrets-and-hardening.md
  - 05 - Generator and Scaffolding Tooling: 05-generator-and-scaffolding.md
  - 06 - Quality, Tests and CI: 06-quality-tests-ci.md
  - 07 - Risks, Gaps and Open Questions: 07-risks-and-gaps.md
  - 08 - Getting Started: 08-getting-started.md
