name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ktlint + detekt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties and secrets.properties
        run: |
          touch local.properties
          echo "API_KEY_DEBUG=\"debug\"" > secrets.properties
          echo "API_KEY_RELEASE=\"release\"" >> secrets.properties
          echo "BASE_URL_DEBUG=\"https://example.com\"" >> secrets.properties
          echo "BASE_URL_RELEASE=\"https://example.com\"" >> secrets.properties
          echo "KEY_ALIAS=\"androiddebugkey\"" >> secrets.properties
          echo "KEY_PASSWORD=\"android\"" >> secrets.properties
          echo "STORE_PASSWORD=\"android\"" >> secrets.properties
          echo "XOR_MASK=\"mask\"" >> secrets.properties
          echo "EXPECTED_SIGNATURE_HASH=\"hash\"" >> secrets.properties

      - name: Run ktlint
        run: ./gradlew ktlintCheck

      - name: Run detekt
        run: ./gradlew detekt

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties and secrets.properties
        run: |
          touch local.properties
          echo "API_KEY_DEBUG=\"debug\"" > secrets.properties
          echo "API_KEY_RELEASE=\"release\"" >> secrets.properties
          echo "BASE_URL_DEBUG=\"https://example.com\"" >> secrets.properties
          echo "BASE_URL_RELEASE=\"https://example.com\"" >> secrets.properties
          echo "KEY_ALIAS=\"androiddebugkey\"" >> secrets.properties
          echo "KEY_PASSWORD=\"android\"" >> secrets.properties
          echo "STORE_PASSWORD=\"android\"" >> secrets.properties
          echo "XOR_MASK=\"mask\"" >> secrets.properties
          echo "EXPECTED_SIGNATURE_HASH=\"hash\"" >> secrets.properties

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

  build:
    name: Assemble Debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties and secrets.properties
        run: |
          touch local.properties
          echo "API_KEY_DEBUG=\"debug\"" > secrets.properties
          echo "API_KEY_RELEASE=\"release\"" >> secrets.properties
          echo "BASE_URL_DEBUG=\"https://example.com\"" >> secrets.properties
          echo "BASE_URL_RELEASE=\"https://example.com\"" >> secrets.properties
          echo "KEY_ALIAS=\"androiddebugkey\"" >> secrets.properties
          echo "KEY_PASSWORD=\"android\"" >> secrets.properties
          echo "STORE_PASSWORD=\"android\"" >> secrets.properties
          echo "XOR_MASK=\"mask\"" >> secrets.properties
          echo "EXPECTED_SIGNATURE_HASH=\"hash\"" >> secrets.properties

      - name: Assemble debug
        run: ./gradlew assembleDebug
