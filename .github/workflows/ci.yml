name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  restore-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/resolve-risks-and-gaps
          fetch-depth: 0
      - name: Restore final workflow
        shell: bash
        run: |
          git show 62c7fd20922966cb2c1fbd2d047aa3088c649955:.github/workflows/ci.yml > /tmp/final-ci.yml
          python3 <<'PY'
          from pathlib import Path
          content = Path("/tmp/final-ci.yml").read_text()
          start = content.index("  source-fixup:\n")
          end = content.index("\n  lint:\n", start)
          content = content[:start] + content[end + 1:]
          content = content.replace("permissions:\n  contents: write", "permissions:\n  contents: read")
          Path(".github/workflows/ci.yml").write_text(content)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml
          git commit -m "ci: finalize quality gates"
          git push origin HEAD:refactor/resolve-risks-and-gaps
