name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-fixup:
    name: Source consistency fixup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/resolve-risks-and-gaps
      - name: Apply exact source updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          catalog = Path("gradle/libs.versions.toml")
          content = catalog.read_text().replace(
              'androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:viewmodel-navigation3",',
              'androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3",',
          )
          catalog.write_text(content)

          scaffold = Path("build-logic/convention/src/main/kotlin/com/ytapps/composetemplate/convention/ScaffoldFeaturePlugin.kt")
          content = scaffold.read_text()
          old = """    constructor() : IScreenProvider {
              @Composable
          """
          new = """    constructor() : IScreenProvider {
              override fun restoreRoute(route: String): INavigationItem? =
                  if (route == ${routeName}Route.route) ${routeName}Route else null

              @Composable
          """
          if old in content:
              content = content.replace(old, new)
          scaffold.write_text(content)

          projector = Path("build-logic/convention/src/main/kotlin/com/ytapps/composetemplate/convention/DataStrategyProjector.kt")
          content = projector.read_text().replace(".replaceRequired(", ".replaceRequiredExactly(")
          content = content.replace("converter-gson =", "converter-kotlinx-serialization =")
          content = content.replace("libs.converter.gson", "libs.converter.kotlinx.serialization")
          cleanup = """            val gsonStart = content.indexOf(\"# Gson: Keep all network model / DTO classes\")
              val serializationStart = content.indexOf(\"# Kotlinx Serialization:\")
              if (gsonStart >= 0 && serializationStart > gsonStart) {
                  content = content.removeRange(content.lastIndexOf(\"# ---\", gsonStart), serializationStart)
              }
          """
          content = content.replace(cleanup, "")
          old_helper = """    private fun File.replaceRequiredExactly(oldValue: String, newValue: String): File {
              val content = readText()
              if (!content.contains(oldValue)) throw GradleException(\"Expected text not found in $path\")
              writeText(content.replace(oldValue, newValue))
              return this
          }
          """
          new_helper = """    internal fun File.replaceRequiredExactly(oldValue: String, newValue: String): File {
              val content = readText()
              val matchCount = content.windowedSequence(oldValue.length).count { it == oldValue }
              if (matchCount != 1) {
                  throw GradleException(\"Expected exactly one match in $path, but found $matchCount\")
              }
              writeText(content.replace(oldValue, newValue))
              return this
          }
          """
          if old_helper in content:
              content = content.replace(old_helper, new_helper)
          projector.write_text(content)

          Path("build-logic/convention/src/test/kotlin/com/ytapps/composetemplate/convention/DataStrategyProjectorTest.kt").write_text('''package com.ytapps.composetemplate.convention

          import org.gradle.api.GradleException
          import java.nio.file.Files
          import kotlin.test.Test
          import kotlin.test.assertEquals
          import kotlin.test.assertFailsWith

          class DataStrategyProjectorTest {
              @Test
              fun `required replacement updates exactly one occurrence`() {
                  val file = Files.createTempFile("projector", ".txt").toFile().apply { writeText("before target after") }

                  with(DataStrategyProjector) {
                      file.replaceRequiredExactly("target", "updated")
                  }

                  assertEquals("before updated after", file.readText())
              }

              @Test
              fun `required replacement rejects missing content`() {
                  val file = Files.createTempFile("projector", ".txt").toFile().apply { writeText("before after") }

                  assertFailsWith<GradleException> {
                      with(DataStrategyProjector) {
                          file.replaceRequiredExactly("target", "updated")
                      }
                  }
              }

              @Test
              fun `required replacement rejects duplicate content`() {
                  val file = Files.createTempFile("projector", ".txt").toFile().apply { writeText("target and target") }

                  assertFailsWith<GradleException> {
                      with(DataStrategyProjector) {
                          file.replaceRequiredExactly("target", "updated")
                      }
                  }
              }
          }
          '''.replace("          ", ""))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm --ignore-unmatch .github/workflows/diagnostic.yml .github/workflows/source-fixup.yml
          git add gradle/libs.versions.toml build-logic/convention/src
          if ! git diff --cached --quiet; then
            git commit -m "fix: harden generated project projections"
            git push origin HEAD:refactor/resolve-risks-and-gaps
          fi

  lint:
    name: Lint (ktlint + detekt + docs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Create local.properties and secrets.properties
        run: bash core/secrets/ci/setup.sh
      - name: Run ktlint
        run: ./gradlew ktlintCheck
      - name: Run detekt
        run: ./gradlew detekt
      - name: Set up Python
        if: ${{ hashFiles('mkdocs.yml') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install MkDocs
        if: ${{ hashFiles('mkdocs.yml') != '' }}
        run: python -m pip install mkdocs-material
      - name: Validate documentation
        if: ${{ hashFiles('mkdocs.yml') != '' }}
        run: mkdocs build --strict

  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Create local.properties and secrets.properties
        run: bash core/secrets/ci/setup.sh
      - name: Run unit tests and coverage
        run: ./gradlew testDebugUnitTest jacocoDebugReport
      - name: Test build logic
        run: ./gradlew -p build-logic :convention:test
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-debug-reports
          path: '**/build/reports/jacoco/jacocoDebugReport/**'
          if-no-files-found: warn

  build:
    name: Assemble Debug + Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Create local.properties and secrets.properties
        run: bash core/secrets/ci/setup.sh
      - name: Assemble debug and release
        run: ./gradlew assembleDebug :app:assembleRelease

  plug-out:
    name: Plug-out (optional modules removed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Create local.properties and secrets.properties
        run: bash core/secrets/ci/setup.sh
      - name: Delete optional modules
        run: |
          set -eu
          for module in core/security core/analytics core/database core/network core/secrets feature/auth benchmark baselineprofile; do
            echo "Removing $module"
            rm -rf "$module"
          done
      - name: Verify removed modules are not referenced
        run: |
          set -eu
          if grep -rn --include="*.kt" -E "core\.security|core\.analytics|core\.database|core\.network|core\.secrets|feature\.auth" app core feature; then
            echo "Removed module is still referenced from Kotlin sources."
            exit 1
          fi
      - name: Assemble debug without optional modules
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug | tee plug-out-build.log
          grep -q "Baseline profiles are disabled" plug-out-build.log

  template-smoke:
    name: Template Smoke (${{ matrix.strategy }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - strategy: remote
            package_name: com.example.remote
            app_name: RemoteApp
            expect_network: true
            expect_database: false
            expect_secrets: true
          - strategy: offline-first
            package_name: com.example.offlinefirst
            app_name: OfflineFirstApp
            expect_network: true
            expect_database: true
            expect_secrets: true
          - strategy: local
            package_name: com.example.local
            app_name: LocalApp
            expect_network: false
            expect_database: true
            expect_secrets: false
          - strategy: minimal
            package_name: com.example.minimal
            app_name: MinimalApp
            expect_network: false
            expect_database: false
            expect_secrets: false
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Create local.properties and secrets.properties
        run: bash core/secrets/ci/setup.sh
      - name: Run benchmark instrumentation
        if: matrix.strategy == 'remote'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :benchmark:connectedBenchmarkAndroidTest
      - name: Verify invalid data strategy is rejected
        if: matrix.strategy == 'remote'
        run: |
          set -euo pipefail
          if ./gradlew create-new-app -Pargs='com.example.invalid,InvalidStrategyApp' -PdataStrategy=invalid -q --console=plain; then
            exit 1
          fi
          test ! -e ../InvalidStrategyApp
      - name: Verify scaffold task
        if: matrix.strategy == 'remote'
        run: ./gradlew help --task scaffoldFeature
      - name: Generate and compile feature scaffolds
        if: matrix.strategy == 'remote'
        run: |
          ./gradlew scaffoldFeature -PfeatureName=ci_feature
          ./gradlew :feature:ci_feature:presentation:compileDebugKotlin
          ./gradlew scaffoldFeature -PfeatureName=ci_database_feature -PwithDatabase=true
          ./gradlew :feature:ci_database_feature:data:compileDebugKotlin :feature:ci_database_feature:presentation:compileDebugKotlin
          rm -rf feature/ci_feature feature/ci_database_feature
      - name: Generate ${{ matrix.strategy }} application
        run: ./gradlew create-new-app -Pargs='${{ matrix.package_name }},${{ matrix.app_name }}' -PdataStrategy='${{ matrix.strategy }}' -q --console=plain
      - name: Verify generated project metadata
        shell: bash
        run: |
          set -euo pipefail
          app_dir="../${{ matrix.app_name }}"
          test -d "$app_dir"
          test ! -d "$app_dir/.git"
          test ! -f "$app_dir/local.properties"
          if [ "${{ matrix.expect_secrets }}" = "true" ]; then
            test -d "$app_dir/core/secrets"
            test -f "$app_dir/secrets.properties.example"
            (cd "$app_dir" && bash core/secrets/ci/setup.sh)
            keytool -genkeypair -keystore "$app_dir/app/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          else
            test ! -d "$app_dir/core/secrets"
            test ! -d "$app_dir/core/security"
            test ! -f "$app_dir/secrets.properties"
            test ! -f "$app_dir/secrets.properties.example"
          fi
      - name: Verify data projection
        shell: bash
        run: |
          set -euo pipefail
          app_dir="../${{ matrix.app_name }}"
          if [ "${{ matrix.expect_network }}" = "true" ]; then
            test -d "$app_dir/core/network"
            test -d "$app_dir/feature/auth"
          else
            test ! -d "$app_dir/core/network"
            test ! -d "$app_dir/feature/auth"
            ! grep -R -E "core:network|core\.network|feature:auth|feature\.auth|libs\.retrofit|libs\.okhttp|libs\.converter\.kotlinx\.serialization|NetworkMonitor|AppNoInternetBanner" "$app_dir" --exclude-dir=.gradle --exclude-dir=build
          fi
          if [ "${{ matrix.expect_database }}" = "true" ]; then
            test -d "$app_dir/core/database"
          else
            test ! -d "$app_dir/core/database"
            ! grep -R -E "core:database|core\.database|androidx.room|androidx-room|AndroidRoomConventionPlugin|withDatabase" "$app_dir" --exclude-dir=.gradle --exclude-dir=build
          fi
      - name: Build generated ${{ matrix.strategy }} application
        working-directory: ../${{ matrix.app_name }}
        run: ./gradlew assembleDebug :app:assembleRelease
      - name: Generate and verify network-backed secret-free application
        if: matrix.strategy == 'remote'
        run: |
          ./gradlew create-new-app -Pargs='com.example.remotesecretfree,RemoteSecretFreeApp' -PdataStrategy=remote -PwithSecrets=false -q --console=plain
          app_dir="../RemoteSecretFreeApp"
          test -d "$app_dir/core/network"
          test -d "$app_dir/feature/auth"
          test ! -d "$app_dir/core/secrets"
          test ! -d "$app_dir/core/security"
          test ! -f "$app_dir/secrets.properties"
          test ! -f "$app_dir/secrets.properties.example"
          test ! -f "$app_dir/local.properties"
          ! grep -R -E "core:secrets|core\.secrets|core:security|core\.security|SecretManager|validateSecrets|scanApkForSecrets|hardeningReport|secrets\.properties|NATIVE_RUNTIME_CHECKS_ENABLED|EXPECTED_SIGNATURE_HASH|XOR_MASK|ndk =" "$app_dir" --exclude-dir=.gradle --exclude-dir=build
          (cd "$app_dir" && ./gradlew assembleDebug :app:assembleRelease)
