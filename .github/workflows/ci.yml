name: CI

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

jobs:
  source-fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/resolve-risks-and-gaps
          fetch-depth: 2
      - name: Apply and commit final source updates
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap

          scaffold = Path("build-logic/convention/src/main/kotlin/com/ytapps/composetemplate/convention/ScaffoldFeaturePlugin.kt")
          content = scaffold.read_text()
          old = "    constructor() : IScreenProvider {\n        @Composable\n"
          new = """    constructor() : IScreenProvider {
                  override fun restoreRoute(route: String): INavigationItem? =
                      if (route == ${routeName}Route.route) ${routeName}Route else null

                  @Composable
          """
          if content.count(old) != 1:
              raise RuntimeError("Generated screen provider insertion point changed")
          scaffold.write_text(content.replace(old, new))

          projector = Path("build-logic/convention/src/main/kotlin/com/ytapps/composetemplate/convention/DataStrategyProjector.kt")
          content = projector.read_text()
          content = re.sub(
              r'\n            val gsonStart = content\.indexOf\("# Gson: Keep all network model / DTO classes"\)\n'
              r'            val serializationStart = content\.indexOf\("# Kotlinx Serialization:"\)\n'
              r'            if \(gsonStart >= 0 && serializationStart > gsonStart\) \{\n'
              r'                content = content\.removeRange\(content\.lastIndexOf\("# ---", gsonStart\), serializationStart\)\n'
              r'            \}\n',
              "\n",
              content,
              count=1,
          )
          content = content.replace("return replaceRequired(homeImport,", "return replaceRequiredExactly(homeImport,")
          old_helper = """    private fun File.replaceRequiredExactly(oldValue: String, newValue: String): File {
              val content = readText()
              if (!content.contains(oldValue)) throw GradleException("Expected text not found in $path")
              writeText(content.replace(oldValue, newValue))
              return this
          }
          """
          new_helper = """    internal fun File.replaceRequiredExactly(oldValue: String, newValue: String): File {
              val content = readText()
              val matchCount = content.windowedSequence(oldValue.length).count { it == oldValue }
              if (matchCount != 1) {
                  throw GradleException("Expected exactly one match in $path, but found $matchCount")
              }
              writeText(content.replace(oldValue, newValue))
              return this
          }
          """
          if content.count(old_helper) != 1:
              raise RuntimeError("Replacement helper changed")
          projector.write_text(content.replace(old_helper, new_helper))

          test = textwrap.dedent('''\
              package com.ytapps.composetemplate.convention

              import org.gradle.api.GradleException
              import java.nio.file.Files
              import kotlin.test.Test
              import kotlin.test.assertEquals
              import kotlin.test.assertFailsWith

              class DataStrategyProjectorTest {
                  @Test
                  fun `required replacement updates exactly one occurrence`() {
                      val file = Files.createTempFile("projector", ".txt").toFile().apply { writeText("before target after") }

                      with(DataStrategyProjector) {
                          file.replaceRequiredExactly("target", "updated")
                      }

                      assertEquals("before updated after", file.readText())
                  }

                  @Test
                  fun `required replacement rejects missing content`() {
                      val file = Files.createTempFile("projector", ".txt").toFile().apply { writeText("before after") }

                      assertFailsWith<GradleException> {
                          with(DataStrategyProjector) {
                              file.replaceRequiredExactly("target", "updated")
                          }
                      }
                  }

                  @Test
                  fun `required replacement rejects duplicate content`() {
                      val file = Files.createTempFile("projector", ".txt").toFile().apply { writeText("target and target") }

                      assertFailsWith<GradleException> {
                          with(DataStrategyProjector) {
                              file.replaceRequiredExactly("target", "updated")
                          }
                      }
                  }
              }
          ''')
          Path("build-logic/convention/src/test/kotlin/com/ytapps/composetemplate/convention/DataStrategyProjectorTest.kt").write_text(test)

          previous_ci = subprocess.check_output(["git", "show", "HEAD^:.github/workflows/ci.yml"], text=True)
          start = previous_ci.index("  source-fixup:\n")
          end = previous_ci.index("\n  lint:\n", start)
          final_ci = previous_ci[:start] + previous_ci[end + 1:]
          final_ci = final_ci.replace("permissions:\n  contents: write", "permissions:\n  contents: read")
          Path(".github/workflows/ci.yml").write_text(final_ci)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/ci.yml build-logic/convention/src
          git commit -m "fix: finalize projection and scaffold hardening"
          git push origin HEAD:refactor/resolve-risks-and-gaps
