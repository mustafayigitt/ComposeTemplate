name: Benchmark Diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/resolve-risks-and-gaps
      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v5
      - name: Create local.properties and secrets.properties
        run: bash core/secrets/ci/setup.sh
      - name: Capture benchmark output
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/run-benchmark-with-retry.sh > .github/benchmark-diagnostics.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/diagnostic.yml
          git add .github/benchmark-diagnostics.txt
          git commit -m 'ci: record benchmark failure diagnostics'
          git push origin HEAD:refactor/resolve-risks-and-gaps
