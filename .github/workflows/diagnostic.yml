name: Source Fixup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/resolve-risks-and-gaps
      - name: Apply exact source updates
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              content = file.read_text()
              actual = content.count(old)
              if actual != count:
                  raise RuntimeError(f"{path}: expected {count} matches, found {actual}: {old!r}")
              file.write_text(content.replace(old, new))

          replace_exact(
              "gradle/libs.versions.toml",
              'androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:viewmodel-navigation3",',
              'androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3",',
          )
          replace_exact(
              "build-logic/convention/src/main/kotlin/com/ytapps/composetemplate/convention/ScaffoldFeaturePlugin.kt",
              """    constructor() : IScreenProvider {
        @Composable
""",
              """    constructor() : IScreenProvider {
        override fun restoreRoute(route: String): INavigationItem? =
            if (route == ${routeName}Route.route) ${routeName}Route else null

        @Composable
""",
          )

          projector = Path("build-logic/convention/src/main/kotlin/com/ytapps/composetemplate/convention/DataStrategyProjector.kt")
          content = projector.read_text().replace(".replaceRequired(", ".replaceRequiredExactly(")
          content = content.replace("converter-gson =", "converter-kotlinx-serialization =")
          content = content.replace("libs.converter.gson", "libs.converter.kotlinx.serialization")
          old_cleanup = """            val gsonStart = content.indexOf(\"# Gson: Keep all network model / DTO classes\")
            val serializationStart = content.indexOf(\"# Kotlinx Serialization:\")
            if (gsonStart >= 0 && serializationStart > gsonStart) {
                content = content.removeRange(content.lastIndexOf(\"# ---\", gsonStart), serializationStart)
            }
"""
          if content.count(old_cleanup) != 1:
              raise RuntimeError("Expected one obsolete Gson cleanup block")
          content = content.replace(old_cleanup, "")
          old_helper = """    private fun File.replaceRequiredExactly(oldValue: String, newValue: String): File {
        val content = readText()
        if (!content.contains(oldValue)) throw GradleException(\"Expected text not found in $path\")
        writeText(content.replace(oldValue, newValue))
        return this
    }
"""
          new_helper = """    internal fun File.replaceRequiredExactly(oldValue: String, newValue: String): File {
        val content = readText()
        val matchCount = content.windowedSequence(oldValue.length).count { it == oldValue }
        if (matchCount != 1) {
            throw GradleException(\"Expected exactly one match in $path, but found $matchCount\")
        }
        writeText(content.replace(oldValue, newValue))
        return this
    }
"""
          if content.count(old_helper) != 1:
              raise RuntimeError("Expected one replacement helper")
          projector.write_text(content.replace(old_helper, new_helper))

          Path("build-logic/convention/src/test/kotlin/com/ytapps/composetemplate/convention/DataStrategyProjectorTest.kt").write_text('''package com.ytapps.composetemplate.convention

import org.gradle.api.GradleException
import java.nio.file.Files
import kotlin.test.Test
import kotlin.test.assertEquals
import kotlin.test.assertFailsWith

class DataStrategyProjectorTest {
    @Test
    fun `required replacement updates exactly one occurrence`() {
        val file = Files.createTempFile("projector", ".txt").toFile().apply { writeText("before target after") }

        with(DataStrategyProjector) {
            file.replaceRequiredExactly("target", "updated")
        }

        assertEquals("before updated after", file.readText())
    }

    @Test
    fun `required replacement rejects missing content`() {
        val file = Files.createTempFile("projector", ".txt").toFile().apply { writeText("before after") }

        assertFailsWith<GradleException> {
            with(DataStrategyProjector) {
                file.replaceRequiredExactly("target", "updated")
            }
        }
    }

    @Test
    fun `required replacement rejects duplicate content`() {
        val file = Files.createTempFile("projector", ".txt").toFile().apply { writeText("target and target") }

        assertFailsWith<GradleException> {
            with(DataStrategyProjector) {
                file.replaceRequiredExactly("target", "updated")
            }
        }
    }
}
''')
      - name: Commit source updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/diagnostic.yml .github/workflows/source-fixup.yml
          git add gradle/libs.versions.toml build-logic/convention/src
          git commit -m "fix: harden generated project projections"
          git push origin HEAD:refactor/resolve-risks-and-gaps
