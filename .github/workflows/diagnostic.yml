name: Final Gate Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/resolve-risks-and-gaps
      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          network = Path("core/network/src/main/java/com/ytapps/composetemplate/core/network/di/NetworkModule.kt")
          content = network.read_text()
          content = content.replace(
              """import okhttp3.CertificatePinner
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.HttpUrl.Companion.toHttpUrl
          """,
              """import okhttp3.CertificatePinner
          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          """,
          )
          content = content.replace(
              """    fun provideNetworkConfig(
                  providers: Set<@JvmSuppressWildcards NetworkConfigProvider>,
              ): NetworkConfigProvider {
          """,
              """    fun provideNetworkConfig(providers: Set<@JvmSuppressWildcards NetworkConfigProvider>): NetworkConfigProvider {
          """,
          )
          content = content.replace(
              """    private fun OkHttpClient.Builder.applyCertificatePinning(
                  networkConfig: NetworkConfigProvider,
              ): OkHttpClient.Builder {
          """,
              """    private fun OkHttpClient.Builder.applyCertificatePinning(networkConfig: NetworkConfigProvider): OkHttpClient.Builder {
          """,
          )
          network.write_text(content)

          generator = Path("build-logic/convention/src/main/kotlin/com/ytapps/composetemplate/convention/CreateNewAppPlugin.kt")
          content = generator.read_text()
          content = content.replace(
              '                        ".github/workflows/pages.yml",\n',
              '                        ".github/workflows/pages.yml",\n                        ".github/workflows/diagnostic.yml",\n',
              1,
          )
          content = content.replace(
              """        removeTemplateOnlyWorkflowJobs(targetDir)
                  writeConsumerReadme(targetDir, appName, withSecrets)
          """,
              """        removeTemplateOnlyWorkflowJobs(targetDir)
                  removeWorkflowStep(targetDir, "Set up Python")
                  removeWorkflowStep(targetDir, "Validate documentation")
                  writeConsumerReadme(targetDir, appName, withSecrets)
          """,
          )
          generator.write_text(content)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/diagnostic.yml
          git add core/network/src/main/java/com/ytapps/composetemplate/core/network/di/NetworkModule.kt build-logic/convention/src/main/kotlin/com/ytapps/composetemplate/convention/CreateNewAppPlugin.kt
          git commit -m "fix: clear lint and consumer generation gates"
          git push origin HEAD:refactor/resolve-risks-and-gaps
