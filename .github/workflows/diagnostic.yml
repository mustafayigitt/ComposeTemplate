name: Remaining Gate Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/resolve-risks-and-gaps
      - name: Apply fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          auth = Path("feature/auth/presentation/src/main/java/com/ytapps/composetemplate/feature/auth/presentation/AuthScreenProvider.kt")
          content = auth.read_text()
          content = content.replace(
              """        override fun restoreRoute(route: String): INavigationItem? =
                      LoginRoute.takeIf { it.route == route }
          """,
              """        override fun restoreRoute(route: String): INavigationItem? = LoginRoute.takeIf { it.route == route }
          """,
          )
          auth.write_text(content)

          projector = Path("build-logic/convention/src/main/kotlin/com/ytapps/composetemplate/convention/DataStrategyProjector.kt")
          content = projector.read_text()
          content = content.replace(
              """        targetDir.findRequired("feature/onboarding/presentation", "OnboardingViewModel.kt")
                      .replaceRequiredExactly("NavigateToHome", "NavigateToLogin")
          """,
              """        targetDir.findRequired("feature/onboarding/presentation", "OnboardingViewModel.kt")
                      .replaceRequiredExactly(
                          "sendEvent(OnboardingEvent.NavigateToHome)",
                          "sendEvent(OnboardingEvent.NavigateToLogin)",
                      ).replaceRequiredExactly(
                          "object NavigateToHome : OnboardingEvent()",
                          "object NavigateToLogin : OnboardingEvent()",
                      )
          """,
          )
          content = content.replace(
              """        targetDir.findByName("DataStrategyProjectionPlugin.kt")?.delete()
                  targetDir.findByName("DataStrategyProjector.kt")?.delete()
          """,
              """        targetDir.findByName("DataStrategyProjectionPlugin.kt")?.delete()
                  targetDir.findByName("DataStrategyProjector.kt")?.delete()
                  targetDir.findByName("DataStrategyProjectorTest.kt")?.delete()
                  targetDir.findByName("DataStrategyTest.kt")?.delete()
          """,
          )
          projector.write_text(content)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/diagnostic.yml
          git add feature/auth/presentation/src/main/java/com/ytapps/composetemplate/feature/auth/presentation/AuthScreenProvider.kt build-logic/convention/src/main/kotlin/com/ytapps/composetemplate/convention/DataStrategyProjector.kt
          git commit -m "fix: complete lint and projection cleanup"
          git push origin HEAD:refactor/resolve-risks-and-gaps
